<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Design Assistant</title>
    <style>
        /* Reset and base styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #1A1A2E 0%, #16213E 100%);
            color: white;
            padding: 20px;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { 
                transform: translateY(20px); 
                opacity: 0; 
            }
            to { 
                transform: translateY(0); 
                opacity: 1; 
            }
        }

        .container {
            animation: slideUp 0.5s ease-out;
        }

        /* Header styles */
        h2 {
            font-size: 22px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 20px;
            background: linear-gradient(90deg, #A259FF, #4C6FFF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: fadeIn 0.6s ease-out;
        }

        /* Main content area */
        .content-box {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 12px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Textarea styles */
        #inputText {
            width: 100%;
            height: 100px;
            background: rgba(0, 0, 0, 0.2);
            border: 2px solid rgba(162, 89, 255, 0.2);
            border-radius: 8px;
            padding: 10px;
            color: white;
            font-size: 14px;
            resize: none;
            transition: all 0.3s ease;
        }

        #inputText::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        #inputText:focus {
            outline: none;
            border-color: #A259FF;
            box-shadow: 0 0 0 4px rgba(162, 89, 255, 0.1);
        }

        /* Button styles */
        #sendText {
            width: 100%;
            margin-top: 12px;
            padding: 8px 16px;
            background: linear-gradient(90deg, #A259FF, #4C6FFF);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #sendText:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        #sendText:active {
            transform: scale(0.98);
        }

        #sendText:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Status message styles */
        #status {
            margin-top: 12px;
            text-align: center;
            font-size: 14px;
            min-height: 20px;
            color: rgba(255, 255, 255, 0.8);
            transition: all 0.3s ease;
        }

        .error {
            color: #FF4D4D !important;
        }

        .success {
            color: #4CAF50 !important;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        .loading {
            color: #A259FF !important;
            animation: pulse 1.5s infinite;
        }

        /* Scrollbar styles */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(162, 89, 255, 0.5);
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Describe Your UI</h2>
        <div class="content-box">
            <textarea 
                id="inputText" 
                placeholder="Enter your design description..."
            ></textarea>
            <button id="sendText">Generate Design</button>
            <div id="status"></div>
        </div>
    </div>

    <script>
        const statusDiv = document.getElementById("status");
        const button = document.getElementById("sendText");
        const textarea = document.getElementById("inputText");

        parent.postMessage({ pluginMessage: { type: 'resize', width: 400, height: 500 } }, '*');

        textarea.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        button.onclick = async () => {
            const prompt = textarea.value;
            if (!prompt.trim()) {
                statusDiv.textContent = "Please enter a prompt";
                statusDiv.className = "error";
                return;
            }

            button.disabled = true;
            statusDiv.textContent = "Generating design...";
            statusDiv.className = "loading";

            parent.postMessage({ pluginMessage: { type: "send-prompt", prompt } }, "*");
        };

        window.onmessage = async (event) => {
            const message = event.data.pluginMessage;
            
            if (message.type === 'error') {
                statusDiv.textContent = `Error: ${message.message}`;
                statusDiv.className = "error";
            } else if (message.type === 'response') {
                statusDiv.textContent = 'Design generated successfully!';
                statusDiv.className = "success";
            }

            button.disabled = false;
        };
    </script>
</body>
</html>
